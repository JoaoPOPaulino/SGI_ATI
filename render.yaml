services:
  - type: web
    name: sgi-ati
    env: node
    rootDir: docker/backend
    buildCommand: cd docker/backend && npm install --include=dev && npm run build
    startCommand: cd docker/backend && node dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        sync: false
