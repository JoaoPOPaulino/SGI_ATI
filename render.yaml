services:
  - type: web
    name: sgi-ati-backend
    env: node
    rootDir: docker/backend
    buildCommand: cd docker/backend && npm install && npm run build
    startCommand: cd docker/backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: noreply@sgi-ati.vercel.app
      - key: RESEND_TO
        sync: false
