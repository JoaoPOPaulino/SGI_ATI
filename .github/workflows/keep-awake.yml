name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}" https://sgi-ati-lon5.onrender.com/api/health || true
