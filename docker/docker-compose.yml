services:
  postgres:
    image: postgres:16-alpine
    container_name: sgi-postgres
    environment:
      POSTGRES_DB: sgi_ati
      POSTGRES_USER: sgi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgi_atl_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgi_user -d sgi_ati"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sgi-backend
    environment:
      DATABASE_URL: postgresql://sgi_user:${DB_PASSWORD:-sgi_atl_2026}@postgres:5432/sgi_ati
      JWT_SECRET: ${JWT_SECRET:-sgi_jwt_secret_dev}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@sgi-ati.vercel.app}
      RESEND_TO: ${RESEND_TO:-}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
